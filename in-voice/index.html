<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recibos &amp; Cotizaciones — Mono Cromat &amp; Co.</title>
  <meta name="description" content="Crea, guarda, imprime y envía recibos y cotizaciones.">
  <meta name="theme-color" content="#2B5EAB">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="tab-datos">

  <!-- ===== Barra superior ===== -->
  <header id="topbar">
    <div class="brand">
      <img src="assets/img/logo-blue.png" alt="logo" class="brand-logo">
      <div class="brand-text">
        <strong>Recibos &amp; Cotizaciones</strong>
        <span>Mono Cromat &amp; Co.</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-install" class="btn small outline" data-action="install" style="display:none">⬇ Instalar app</button>
      <button class="btn small outline" data-action="settings">⚙ Ajustes</button>
    </div>
  </header>

  <main>
    <!-- ===== Vista: lista ===== -->
    <section id="view-list">
      <div class="list-head">
        <h1>Documentos</h1>
        <div class="list-head-actions">
          <button class="btn primary" data-action="new-recibo">＋ Nuevo recibo</button>
          <button class="btn outline" data-action="new-cotizacion">Nueva cotización</button>
        </div>
      </div>
      <div class="list-tools">
        <input id="search" type="search" placeholder="Buscar por número, proyecto, cliente…">
        <div class="chips">
          <button class="chip active" data-filter="todos">Todos</button>
          <button class="chip" data-filter="recibo">Recibos</button>
          <button class="chip" data-filter="cotizacion">Cotizaciones</button>
        </div>
      </div>
      <div id="doc-list" class="doc-list"></div>
    </section>

    <!-- ===== Vista: editor ===== -->
    <section id="view-editor" hidden>
      <div class="editor-bar">
        <button class="btn small outline" data-action="back">← Volver</button>
        <div class="editor-bar-title">
          <span id="editor-mode-label">Documento</span>
        </div>
        <div class="editor-bar-actions">
          <button class="btn small" data-action="save">💾 Guardar</button>
          <button class="btn small" data-action="print">🖨 PDF / Imprimir</button>
          <button class="btn small" data-action="email">✉ Enviar</button>
          <button class="btn small" data-action="share">📤 Compartir</button>
          <button class="btn small danger" data-action="delete">🗑</button>
        </div>
      </div>

      <div class="editor-tabs">
        <button class="on" data-tab="datos" data-action="tab">Datos</button>
        <button data-tab="preview" data-action="tab">Vista previa</button>
      </div>

      <div class="editor-layout">
        <div class="editor-form" id="editor-form"></div>
        <div class="editor-preview">
          <div class="preview-frame" id="preview-frame">
            <div id="preview-inner"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== Modal de ajustes ===== -->
  <div id="modal-settings" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2>⚙ Ajustes</h2>
        <button class="icon-btn" data-action="close-settings">✕</button>
      </div>
      <div id="settings-body" class="modal-body"></div>
      <div class="modal-foot">
        <button class="btn outline" data-action="close-settings">Cancelar</button>
        <button class="btn primary" data-action="save-settings">Guardar ajustes</button>
      </div>
    </div>
  </div>

  <!-- ===== Área de impresión ===== -->
  <div id="print-area"></div>

  <div id="toast"></div>

  <script src="assets/js/jspdf.umd.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/render.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
